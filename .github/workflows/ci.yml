
name: COMP3104 CI

on:
  push:
  pull_request:

jobs:
  check-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README
        run: test -f README.md

      - name: Check assignment files
        shell: bash
        run: |
          echo "Checking assignment text files..."

          files=$(find . -maxdepth 1 -name '*_gb.txt' | wc -l)
          echo "George Brown files: $files"

          files=$(find . -maxdepth 1 -name '*_devops.txt' | wc -l)
          echo "DevOps files: $files"

          files=$(find . -maxdepth 1 -name '*_sdlc.txt' | wc -l)
          echo "SDLC files: $files"

          test -f 101272609_gb.txt
          test -f 101272609_devops.txt
          test -f 101272609_sdlc.txt

      - name: Finish
        run: echo "CI checks completed"
